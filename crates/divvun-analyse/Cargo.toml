[package]
name = "divvun-analyse"
version = "0.1.0"
edition = "2021"

[lib]
name = "divvun_analyse"
crate-type = ["staticlib", "rlib"]

[dependencies]
divvun-runtime = { path = "../../../../divvun-runtime", default-features = false, features = ["mod-hfst", "mod-cg3", "mod-divvun"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
thiserror = "2"
futures-util = "0.3"
